<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HotelPro API - Status</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }
    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 2.5em;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 1.1em;
    }
    .status {
      display: flex;
      align-items: center;
      padding: 20px;
      background: #f0f9ff;
      border-radius: 8px;
      margin-bottom: 30px;
    }
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 12px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .status-text {
      color: #0c4a6e;
      font-weight: 500;
    }
    .endpoints {
      margin-top: 20px;
    }
    .endpoint-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 15px;
      font-size: 1.2em;
    }
    .endpoint {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: #f8fafc;
      border-left: 3px solid #667eea;
      margin-bottom: 10px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
    }
    .method {
      color: #667eea;
      font-weight: bold;
      margin-right: 10px;
      min-width: 60px;
    }
    .path {
      color: #334155;
    }
    .footer {
      margin-top: 30px;
      text-align: center;
      color: #666;
      font-size: 0.9em;
    }
    a {
      color: #667eea;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏨 HotelPro API</h1>
    <p class="subtitle">Hotel Management REST API</p>
    
    <div class="status">
      <div class="status-indicator"></div>
      <div class="status-text">API is running and operational</div>
    </div>

    <div class="endpoints">
      <div class="endpoint-title">📋 Available Endpoints</div>
      <div class="endpoint">
        <span class="method">GET</span>
        <span class="path">/api/health</span>
      </div>
      <div class="endpoint">
        <span class="method">POST</span>
        <span class="path">/api/auth/register</span>
      </div>
      <div class="endpoint">
        <span class="method">POST</span>
        <span class="path">/api/auth/login</span>
      </div>
      <div class="endpoint">
        <span class="method">GET</span>
        <span class="path">/api/rooms</span>
      </div>
      <div class="endpoint">
        <span class="method">POST</span>
        <span class="path">/api/bookings</span>
      </div>
      <div class="endpoint">
        <span class="method">GET</span>
        <span class="path">/api/dashboard/stats</span>
      </div>
    </div>

    <div class="footer">
      <p>For API documentation and full endpoint list, check the <a href="https://github.com/Mohitrath/Hotel-Pro" target="_blank">repository</a></p>
    </div>
  </div>

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { 
      (window.vaq = window.vaq || []).push(arguments); 
    };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
